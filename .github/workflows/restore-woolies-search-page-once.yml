name: Restore Woolies search page once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-woolies-search-page-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore known-working Woolies page size
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('mobile/StuffApp.js')
          s=p.read_text()
          if 'PageSize:40' not in s:
              raise SystemExit('PageSize:40 not found')
          s=s.replace('PageSize:40','PageSize:30',1)
          p.write_text(s)
          Path('.github/workflows/restore-woolies-search-page-once.yml').unlink()
          PY
      - name: Commit
        run: |
          git config user.name "Stuff release bot"
          git config user.email "actions@users.noreply.github.com"
          git add mobile/StuffApp.js .github/workflows/restore-woolies-search-page-once.yml
          git commit -m "Restore Woolies search page size"
          git push
