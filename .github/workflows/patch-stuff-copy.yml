name: Patch Stuff preference copy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-stuff-copy.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update stale usuals copy
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('mobile/StuffApp.js')
          s = p.read_text()
          replacements = {
            'sub="Later, learn from the products you actually choose"': 'sub="Learn repeated household choices and favour them next time"',
            'Best match, cheapest suitable, specials and alternative settings now change how Stuff chooses Woolworths products. Usual-brand learning comes next.': 'Best match, cheapest suitable, specials and alternative settings change how Stuff chooses products. Learned usuals are used when Remember usual brands is on.'
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Missing expected text: {old}')
              s = s.replace(old, new)
          p.write_text(s)
          PY
      - name: Commit copy cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/StuffApp.js
          git commit -m "Fix stale usuals copy"
          git push
