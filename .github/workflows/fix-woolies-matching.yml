name: Fix Woolies matching

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-woolies-matching.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Harden Woolies product matching
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python /tmp/patch.py
      - name: Commit patch and remove one-time workflow
        shell: bash
        run: |
          git config user.name "Stuff release bot"
          git config user.email "actions@users.noreply.github.com"
          git add mobile/StuffApp.js
          git rm .github/workflows/fix-woolies-matching.yml
          git commit -m "Harden Woolies matching and quantity logic"
          git push
