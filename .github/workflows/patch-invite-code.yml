name: Add manual household invite code

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-invite-code.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add invite code fallback
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('mobile/StuffApp.js')
          s = app.read_text()

          replacements = [
            (
              'export default function StuffApp() {',
              'export default function StuffApp({onJoinHouseholdCode}) {'
            ),
            (
              "  const [invite,setInvite]=useState({name:'',contact:''});\n  const [moreView,setMoreView]=useState('main');",
              "  const [invite,setInvite]=useState({name:'',contact:''});\n  const [joinCode,setJoinCode]=useState('');\n  const [moreView,setMoreView]=useState('main');"
            ),
            (
              "\n  function removeMember(member){",
              "\n  async function joinHouseholdWithCode(){\n    const code=joinCode.trim().toUpperCase();\n    if(!code){Alert.alert('Invite code','Enter the invite code you were sent.');return}\n    if(!user){goToStuffLogin();return}\n    if(!onJoinHouseholdCode){Alert.alert('Could not join household','Invite-code joining is unavailable in this build.');return}\n    setDataBusy(true);\n    try{\n      await onJoinHouseholdCode(code);\n      setJoinCode('');\n    }catch(e){Alert.alert('Could not join household',e?.message||'The invite may be invalid or expired.')}finally{setDataBusy(false)}\n  }\n\n  function removeMember(member){"
            ),
            (
              "  if(tab==='household'&&householdView==='name')return <SafeAreaView style={s.safe}>",
              "  if(tab==='household'&&householdView==='join')return <SafeAreaView style={s.safe}>\n    <StatusBar barStyle=\"dark-content\" backgroundColor=\"#F7F1E3\"/>\n    <ScrollView contentContainerStyle={s.pageScreen} keyboardShouldPersistTaps=\"handled\">\n      <PageHeader eyebrow=\"Household\" title=\"Join a household\" lead=\"Use an invite code to switch to the shared household shopping list.\" onBack={()=>setHouseholdView('main')} backLabel=\"Household\" />\n      <View style={s.formBlock}>\n        <Field label=\"Invite code\" value={joinCode} onChangeText={setJoinCode} autoCapitalize=\"characters\" placeholder=\"8-character code\" />\n      </View>\n      <TouchableOpacity style={[s.primaryButton,dataBusy&&s.buttonDisabled]} onPress={joinHouseholdWithCode} disabled={dataBusy}>{dataBusy?<ActivityIndicator color=\"#FFFFFF\"/>:<Text style={s.primaryButtonText}>Join household</Text>}</TouchableOpacity>\n      <Text style={s.formNote}>Use the code another Stuff household member shared with you. This is also the fallback when an invite link cannot open directly.</Text>\n    </ScrollView>\n    <BottomNav tab={tab} onChange={goTab}/>\n  </SafeAreaView>;\n\n  if(tab==='household'&&householdView==='name')return <SafeAreaView style={s.safe}>"
            ),
            (
              "        <MenuRow title=\"Invite someone\" sub=\"Add another person to the shared household\" onPress={()=>setHouseholdView('invite')} />",
              "        <MenuRow title=\"Invite someone\" sub=\"Add another person to the shared household\" onPress={()=>setHouseholdView('invite')} />\n        <MenuRow title=\"Join with invite code\" sub=\"Use a code someone shared with you\" onPress={()=>setHouseholdView('join')} />"
            ),
          ]

          for old, new in replacements:
              if s.count(old) != 1:
                  raise SystemExit(f'Expected exactly one StuffApp match for: {old[:80]}')
              s = s.replace(old, new, 1)
          app.write_text(s)

          root = Path('mobile/AppRoot.js')
          r = root.read_text()
          old = "  return <StuffApp key={`stuff-${appKey}`} />;"
          new = """  async function joinHouseholdCode(code) {\n    const clean = String(code || '').trim().toUpperCase();\n    if (!clean) throw new Error('Enter an invite code.');\n    if (!user) throw new Error('Sign in to Stuff before joining a household.');\n    await acceptStuffInvite(clean);\n    await AsyncStorage.removeItem(PENDING_INVITE_KEY).catch(() => {});\n    setPendingInvite(null);\n    setAppKey(value => value + 1);\n    Alert.alert('Household joined', 'You’re now using the shared household shopping list.');\n  }\n\n  return <StuffApp key={`stuff-${appKey}`} onJoinHouseholdCode={joinHouseholdCode} />;"""
          if r.count(old) != 1:
              raise SystemExit('Expected AppRoot StuffApp return once')
          root.write_text(r.replace(old, new, 1))
          PY
      - name: Commit invite fallback
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/StuffApp.js mobile/AppRoot.js
          git commit -m "Add household invite code fallback"
          git push
