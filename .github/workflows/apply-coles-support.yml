name: Apply Coles support

on:
  push:
    paths:
      - '.github/workflows/apply-coles-support.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add Coles support
        run: python3 .github/scripts/add_coles_support.py
      - name: Commit Coles support
        run: |
          git config user.name "stuff-shopping-bot"
          git config user.email "actions@users.noreply.github.com"
          git add mobile/StuffApp.js mobile/stuffData.js
          git commit -m "Add Coles matching and supermarket preference"
          git push origin HEAD:main
