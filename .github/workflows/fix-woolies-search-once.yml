name: Fix Woolies search once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-woolies-search-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore Woolies grocery search compatibility
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('mobile/StuffApp.js')
          s = p.read_text()
          old = "PageNumber:1,PageSize:40,SearchTerm:q,SortType:'TraderRelevance',IsHideEverydayMarketProducts:true"
          new = "PageNumber:1,PageSize:30,SearchTerm:q,SortType:'TraderRelevance',IsHideEverydayMarketProducts:false"
          if old not in s:
              raise SystemExit('Expected Woolies search block not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit fix and remove workflow
        shell: bash
        run: |
          git config user.name "Stuff release bot"
          git config user.email "actions@users.noreply.github.com"
          git add mobile/StuffApp.js
          git rm .github/workflows/fix-woolies-search-once.yml
          git commit -m "Restore Woolies search compatibility"
          git push
