name: Fix Woolies reconciliation once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-woolies-reconciliation-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch matcher and reconciliation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('mobile/StuffApp.js')
          text = path.read_text()

          query_block = r''' const baseQuery=i=>String(i.name||'').replace(/\\b(cheapest suitable|on special|cheapest|best value|value option)\\b/gi,'').replace(/\\s+/g,' ').trim().replace(/weet\\s*-?\\s*a?bix|weetbix|weet bix/gi,'Weet-Bix');
 const query=i=>{let q=baseQuery(i);const r=req(i);if(/baby (roma )?tomato/i.test(r))q='cherry tomatoes';const m=measure(i);if(m&&!q.toLowerCase().includes(String(m.n)+m.u))q+=' '+m.n+m.u;const pc=packIntent(i);if(pc){if(/coca|cola/.test(r))q+=' '+pc+' can pack';else q+=' '+pc+' pack'}if(/\\bbag\\b/.test(unitText(i))&&!/\\bbag\\b/i.test(q))q+=' bag';if(r.includes('salmon')&&r.includes('fillet')&&requestQty(i)>1)q+=' '+requestQty(i)+' fillets';return q};
 const searchQueries=i=>{const r=req(i),out=[query(i),baseQuery(i)];if(/baby (roma )?tomato/.test(r))out.push('cherry tomatoes');if(/\\bavocados?\\b/.test(r))out.push('fresh avocado');if(/\\bbananas?\\b/.test(r))out.push('fresh bananas');if(/\\bapples?\\b/.test(r))out.push('fresh apples');if(r.includes('chicken breast'))out.push('chicken breast');if(r.includes('cheddar'))out.push('cheddar cheese');if(/weet[- ]?bix/.test(r))out.push('Weet-Bix');if(r.includes('greek yoghurt')||r.includes('greek yogurt'))out.push('Greek yoghurt');if(r.includes('shapes'))out.push(r.includes('bbq')?"Arnott's BBQ Shapes":"Arnott's Shapes");if(r.includes('chocolate muffin'))out.push('chocolate muffins');if(r.includes('salmon'))out.push('salmon fillets');return [...new Set(out.map(x=>String(x||'').replace(/\\s+/g,' ').trim()).filter(Boolean))].slice(0,5)};
 const words=s=>String(s||'').toLowerCase().split(/[^a-z0-9]+/).filter(w=>w&&!/^\\d+(?:kg|g|l|ml)?$/.test(w)&&!['kg','g','l','ml','the','a','an','of','and','for','pack','packet','bag','box','large','small','medium','suitable','fresh'].includes(w));'''

          text, n = re.subn(r"^ const query=i=>.*\n const words=.*$", query_block, text, count=1, flags=re.M)
          if n != 1:
              raise SystemExit('query block not found')

          matcher_block = r''' const coreValid=(i,p)=>{const r=req(i),t=txt(p);if(/\\bavocados?\\b/.test(r))return /\\bavocados?\\b/.test(t)&&!/(storage|keeper|saver|holder|container|gadget|tool|slicer|cutter|oil|dip|spread|seasoning|flavour|flavor)/.test(t);if(/\\bbananas?\\b/.test(r))return /\\bbananas?\\b/.test(t)&&!/(bread|chips|smoothie|flavour|flavor|baby food|lolly|candy)/.test(t);if(/\\bapples?\\b/.test(r)&&!/(juice|cider|sauce|pie)/.test(r))return /\\bapples?\\b/.test(t)&&!/(juice|cider|sauce|pie|flavour|flavor|candle|fragrance)/.test(t);if(r.includes('chicken breast')&&!/(diced|nugget|crumb|schnitzel|tender|strip|kiev|burger)/.test(r))return t.includes('chicken')&&t.includes('breast')&&!/(diced|nugget|crumbed|schnitzel|tender|strip|kiev|burger)/.test(t);if(r.includes('chocolate muffin'))return t.includes('muffin')&&t.includes('chocolate');if(r.includes('shapes')){if(!t.includes('shapes'))return false;if(r.includes('bbq')&&!/(\\bbbq\\b|barbecue)/.test(t))return false;if(!/(fully loaded|korean)/.test(r)&&/(fully loaded|korean)/.test(t))return false;return true}if(/weet[- ]?bix/.test(r)&&!r.includes('bites'))return /weet[- ]?bix/.test(t)&&!t.includes('bites');if(r.includes('full cream milk'))return t.includes('milk')&&t.includes('full cream')&&!t.includes('lactose');if(r.includes('cheddar'))return t.includes('cheddar')&&t.includes('cheese');if(r.includes('greek yoghurt')||r.includes('greek yogurt'))return t.includes('greek')&&(t.includes('yoghurt')||t.includes('yogurt'));return true};
 const bad=(i,p)=>{const r=req(i),t=txt(p),u=unitText(i);if(!coreValid(i,p))return true;if(r.includes('muffin')&&/(mould|mold|silicone|baking tray|muffin tray|muffin pan|cupcake case|liner)/.test(t))return true;if(r.includes('chicken breast')&&!/(diced|nugget|crumb|schnitzel|tender|strip|kiev|burger)/.test(r)&&/(diced|nugget|crumbed|schnitzel|tender|strip|kiev|burger)/.test(t))return true;if(/\\bbag\\b/.test(u)&&/\\beach\\b/.test(t)&&!/banana/.test(r))return true;if(/baby (roma )?tomato/.test(r)){if(!t.includes('tomato')||!['cherry','grape','cocktail','solanato','mini'].some(x=>t.includes(x)))return true;if(['diced','crushed','peeled','passata','paste','sauce','canned','tinned','mutti'].some(x=>t.includes(x)))return true}else if(r.includes('tomato')){const canned=/\\b(diced|crushed|peeled|canned|tinned|tin)\\b/.test(r);if(canned){if(!t.includes('tomato'))return true;if(['cherry','grape','cocktail','fresh punnet'].some(x=>t.includes(x)))return true;if(r.includes('diced')&&!/(diced|chopped)/.test(t))return true}else if(['diced','crushed','peeled','passata','paste','sauce','canned','tinned'].some(x=>t.includes(x)))return true}if(r.includes('carrot')&&!r.includes('baby')&&t.includes('baby carrot'))return true;if(r.includes('bread')&&['bread mix','flour','breadcrumb'].some(x=>t.includes(x)))return true;const pc=packIntent(i),pp=pPackCount(p);if(requiresPack(i)){if(!pp)return true;const ratio=pp/pc;if(ratio<.75||ratio>1.34)return true}const a=measure(i),b=pMeasure(p);if(a?.b&&b?.b){const ratio=b.b/a.b;if(ratio<.5||ratio>1.75)return true}return false};
 const coreBonus=(i,p)=>{const r=req(i);return /(avocado|banana|apple|chicken breast|chocolate muffin|shapes|weet[- ]?bix|full cream milk|cheddar|greek yog)/.test(r)&&coreValid(i,p)?45:0};
 const score=(i,p)=>{if(bad(i,p))return-9999;const q=query(i),t=txt(p),ws=words(q);let s=ws.filter(w=>t.includes(w)).length*18+coreBonus(i,p);if(t.includes(q.toLowerCase()))s+=60;const r=req(i),a=measure(i),b=pMeasure(p);if(a?.b){if(!b?.b)s+=r.includes('banana')?35:-45;else{const x=b.b/a.b;s+=x>=.95&&x<=1.05?160:x>=.85&&x<=1.15?90:x>=.7&&x<=1.3?30:x>=.5&&x<=1.75?-30:-220}}const pc=packIntent(i),pp=pPackCount(p);if(pc){if(pp===pc)s+=220;else if(pp){const x=pp/pc;s+=x>=.9&&x<=1.1?120:x>=.75&&x<=1.34?25:-180}else if(requiresPack(i))s-=220}if(/\\b(large|big|family)\\b/.test(r)&&b?.b)s+=Math.min(70,b.b/20);if(/baby (roma )?tomato/.test(r)&&['cherry','grape','cocktail','mini'].some(x=>t.includes(x)))s+=150;if(r.includes('white bread')&&t.includes('white')&&(t.includes('bread')||t.includes('loaf')))s+=60;if(/\\bbag\\b/.test(unitText(i))&&/\\b(bag|pack)\\b/.test(t))s+=90;if((prefs.preferSpecials||/\\bon special\\b/.test(r))&&p.IsOnSpecial)s+=/\\bon special\\b/.test(r)?180:30;const mem=memoryFor(i);if(prefs.rememberBrands&&mem&&+mem.times_used>=2&&String(mem.product_id)===String(p.Stockcode)&&!/\\b(cheapest|best value|value option|on special)\\b/.test(r))s+=Math.min(260,100+(+mem.times_used*35));if(p.IsAvailable===false||p.IsInStock===false)s-=200;return s};'''

          text, n = re.subn(r"^ const bad=.*\n const score=.*$", matcher_block, text, count=1, flags=re.M)
          if n != 1:
              raise SystemExit('matcher block not found')

          search_block = r''' async function search(i){const out=[],seen=new Set();for(const q of searchQueries(i)){let res;try{res=await fetch('/apis/ui/Search/products',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json, text/plain, */*'},credentials:'same-origin',body:JSON.stringify({Filters:[],IsSpecial:false,Location:'/shop/search/products?searchTerm='+encodeURIComponent(q),PageNumber:1,PageSize:40,SearchTerm:q,SortType:'TraderRelevance',IsHideEverydayMarketProducts:false,ExcludeSearchTypes:['UntraceableVendors'],GpBoost:0,GroupEdmVariants:false,EnableAdReRanking:false})})}catch(_){continue}if(!res?.ok)continue;let d;try{d=await res.json()}catch(_){continue}for(const g of d?.Products||[])for(const p of g?.Products||[]){const id=String(p?.Stockcode||'');if(id&&!seen.has(id)){seen.add(id);out.push(p)}}if(out.length>=60)break}if(!out.length)throw Error('search');return out}'''
          text, n = re.subn(r"^ async function search\(i\)\{.*$", search_block, text, count=1, flags=re.M)
          if n != 1:
              raise SystemExit('search function not found')

          old_qty = "if(m){if(!pMeasure(p)&&r.includes('banana')&&m.u==='kg')return Math.max(1,Math.min(12,Math.round(m.n*6)));return 1}"
          new_qty = "if(m){const pm=pMeasure(p);if(!pm&&r.includes('banana')&&m.u==='kg')return Math.max(1,Math.min(12,Math.round(m.n*6)));if(pm?.b&&m.b)return Math.max(1,Math.min(6,Math.ceil(m.b/pm.b)));return 1}"
          if old_qty not in text:
              raise SystemExit('cart quantity block not found')
          text = text.replace(old_qty, new_qty, 1)

          old_rank = "filter(x=>x.p?.Stockcode&&x.s>=20&&x.hits>=needed)"
          if old_rank not in text:
              raise SystemExit('ranking threshold not found')
          text = text.replace(old_rank, "filter(x=>x.p?.Stockcode&&x.s>=28&&x.hits>=needed)", 1)

          text = text.replace("let added=0,failed=0,remembered=[];", "let added=0,failed=0,failedNames=[],remembered=[];", 1)
          text = text.replace("}else failed++;await sleep(220)", "}else{failed++;failedNames.push(i.name)}await sleep(220)", 1)
          old_msg = "const message=added+' products added.'+(unmatched.length?' Could not confidently match: '+unmatched.join(', ')+'.':'')+(failed?' '+failed+' failed to add.':'');post('WOOLIES_DONE',message,{added,failed,unmatched,remembered,success:added>0})"
          new_msg = "const message=added+' products added.'+(unmatched.length?' Could not confidently match: '+unmatched.join(', ')+'.':'')+(failed?' Failed to add: '+failedNames.join(', ')+'.':'');post('WOOLIES_DONE',message,{added,failed,failedNames,unmatched,remembered,success:added>0})"
          if old_msg not in text:
              raise SystemExit('completion message not found')
          text = text.replace(old_msg, new_msg, 1)

          old_open = "function openCart(){setStatus('Opening your Woolies cart…');setCartUrl(CART_URL+'?stuffShopping='+Date.now())}"
          new_open = "function openCart(){setStatus('Opening your Woolies cart…');setCartUrl(CART_URL+'?stuffShopping='+Date.now());setWebKey(k=>k+1)}"
          if old_open not in text:
              raise SystemExit('openCart function not found')
          text = text.replace(old_open, new_open, 1)

          old_done = "if(m?.type==='WOOLIES_DONE'){clearRetailerWatchdog();const added=Number(m.added||0);for(const x of (m.remembered||[]))learnProduct('woolworths',x);pending.current=[];setStatus(added?`Done — ${added} ${added===1?'product':'products'} added.`:(m.message||'Nothing was added.'));if(added)setTimeout(openCart,350)}"
          new_done = "if(m?.type==='WOOLIES_DONE'){clearRetailerWatchdog();const added=Number(m.added||0),unmatched=Array.isArray(m.unmatched)?m.unmatched:[],failedNames=Array.isArray(m.failedNames)?m.failedNames:[],needsReview=[...unmatched,...failedNames];for(const x of (m.remembered||[]))learnProduct('woolworths',x);pending.current=[];setStatus(added?`Done — ${added} added${needsReview.length?` · ${needsReview.length} need review`:''}.`:(m.message||'Nothing was added.'));if(needsReview.length){Alert.alert('A few items need your attention',`${added} added to Woolies.\\n\\nNot added:\\n• ${needsReview.join('\\n• ')}`,[{text:'Review Woolies cart',onPress:openCart}])}else if(added)setTimeout(openCart,350)}"
          if old_done not in text:
              raise SystemExit('WOOLIES_DONE handler not found')
          text = text.replace(old_done, new_done, 1)

          path.write_text(text)
          Path('.github/workflows/fix-woolies-reconciliation-once.yml').unlink()
          PY
      - name: Commit patch
        run: |
          git config user.name "Stuff release bot"
          git config user.email "actions@users.noreply.github.com"
          git add mobile/StuffApp.js .github/workflows/fix-woolies-reconciliation-once.yml
          git commit -m "Reconcile Woolies matches and surface missing items"
          git push
