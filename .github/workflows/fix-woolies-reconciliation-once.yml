name: Fix Woolies reconciliation once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-woolies-reconciliation-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch matcher and reconciliation
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python /tmp/patch.py
      - name: Commit patch
        run: |
          git config user.name "Stuff release bot"
          git config user.email "actions@users.noreply.github.com"
          git add mobile/StuffApp.js .github/workflows/fix-woolies-reconciliation-once.yml
          git commit -m "Reconcile Woolies matches and surface missing items"
          git push
