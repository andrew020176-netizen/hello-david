name: Mobile check

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-check.yml'
  pull_request:
    paths:
      - 'mobile/**'

jobs:
  expo-bundle:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package.json
      - run: npm install
      - run: npx expo export --platform ios --output-dir dist-check
