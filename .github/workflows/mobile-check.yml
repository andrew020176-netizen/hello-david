name: Mobile check

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-check.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-check.yml'

jobs:
  expo-bundle:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package.json
      - run: npm install
      - name: Validate release assets and config
        run: |
          test -s assets/icon.png
          test -s assets/adaptive-icon.png
          node -e "const fs=require('fs'); for (const f of ['app.json','eas.json']) JSON.parse(fs.readFileSync(f,'utf8'));"
          npx expo config --type public > /dev/null
      - run: npx expo export --platform ios --output-dir dist-check
