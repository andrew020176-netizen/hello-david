name: Verify Stuff mobile once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-mobile-once.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx expo config --type public > /dev/null
      - run: npx expo export --platform ios --output-dir dist-check
