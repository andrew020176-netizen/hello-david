name: Fix Woolies script escaping once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-woolies-script-escaping-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Fix generated-script regex escaping
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('mobile/StuffApp.js')
          s=p.read_text()
          start=s.find(' const baseQuery=i=>')
          end=s.find(' async function search(i)', start)
          if start < 0 or end < 0:
              raise SystemExit('Woolies matcher block not found')
          block=s[start:end]
          if '\\\\b' in block or '\\\\s' in block or '\\\\d' in block:
              raise SystemExit('Matcher block already appears double-escaped')
          block=block.replace('\\','\\\\')
          s=s[:start]+block+s[end:]
          p.write_text(s)
          Path('.github/workflows/fix-woolies-script-escaping-once.yml').unlink()
          PY
      - name: Commit
        run: |
          git config user.name "Stuff release bot"
          git config user.email "actions@users.noreply.github.com"
          git add mobile/StuffApp.js .github/workflows/fix-woolies-script-escaping-once.yml
          git commit -m "Fix Woolies generated-script escaping"
          git push
