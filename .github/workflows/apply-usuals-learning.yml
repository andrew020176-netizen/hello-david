name: Apply usual-product learning

on:
  push:
    paths:
      - '.github/workflows/apply-usuals-learning.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add household usuals learning
        run: python3 .github/scripts/add_usuals_learning.py
      - name: Commit usuals learning
        run: |
          git config user.name "stuff-shopping-bot"
          git config user.email "actions@users.noreply.github.com"
          git add mobile/StuffApp.js mobile/stuffData.js
          git commit -m "Add household usual-product learning"
          git push origin HEAD:main
