name: Align retailer UI

on:
  push:
    paths:
      - '.github/workflows/align-retailer-ui.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Align retailer experience
        run: python3 .github/scripts/align_retailers.py
      - name: Commit retailer alignment
        run: |
          git config user.name "stuff-shopping-bot"
          git config user.email "actions@users.noreply.github.com"
          git add mobile/StuffApp.js
          git commit -m "Use preferred supermarket across the app"
          git push origin HEAD:main
