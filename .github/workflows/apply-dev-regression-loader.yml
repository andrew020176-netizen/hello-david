name: Apply developer regression loader

on:
  push:
    paths:
      - '.github/workflows/apply-dev-regression-loader.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add regression loader
        run: python3 .github/scripts/add_dev_regression_loader.py
      - name: Commit regression loader
        run: |
          git config user.name "stuff-shopping-bot"
          git config user.email "actions@users.noreply.github.com"
          git add mobile/StuffApp.js
          git commit -m "Add developer regression shop loader"
          git push origin HEAD:main
