name: Fix Woolies accuracy once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-woolies-accuracy-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tighten Woolies accuracy and restore useful fallbacks
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('mobile/StuffApp.js')
          s=p.read_text()
          s=s.replace("const words=s=>String(s||'').toLowerCase().split(/[^a-z0-9]+/).filter(w=>w&&!['the','a','an','of','and','for','pack','packet','bag','box','large','small','medium','suitable'].includes(w));",
                    "const words=s=>String(s||'').toLowerCase().split(/[^a-z0-9]+/).filter(w=>w&&!/^\\d+(?:kg|g|l|ml)?$/.test(w)&&!['kg','g','l','ml','the','a','an','of','and','for','pack','packet','bag','box','large','small','medium','suitable'].includes(w));")
          old="if(r.includes('muffin')&&/(mould|mold|silicone|baking tray|muffin tray|muffin pan|cupcake case|liner)/.test(t))return true;if(r.includes('chicken breast')&&!/(nugget|crumb|schnitzel|tender|strip|kiev|burger)/.test(r)&&/(nugget|crumbed|schnitzel|tender|strip|kiev|burger)/.test(t))return true;if(r.includes('full cream milk')&&!r.includes('lactose')&&t.includes('lactose'))return true;if(/weet[- ]?bix/.test(r)&&!r.includes('bites')&&t.includes('bites'))return true;if(r.includes('shapes')&&/(cabanossi|trios|salami|ham snack)/.test(t))return true;"
          new="if(r.includes('muffin')&&/(mould|mold|silicone|baking tray|muffin tray|muffin pan|cupcake case|liner)/.test(t))return true;if(r.includes('chocolate muffin')&&!t.includes('chocolate'))return true;if(r.includes('avocado')&&/(storage|keeper|saver|holder|container|gadget|tool)/.test(t))return true;if(r.includes('chicken breast')&&!/(diced|nugget|crumb|schnitzel|tender|strip|kiev|burger)/.test(r)&&/(diced|nugget|crumbed|schnitzel|tender|strip|kiev|burger)/.test(t))return true;if(r.includes('full cream milk')&&!r.includes('lactose')&&t.includes('lactose'))return true;if(/weet[- ]?bix/.test(r)&&!r.includes('bites')&&t.includes('bites'))return true;if(r.includes('shapes')&&/(cabanossi|trios|salami|ham snack|fully loaded|korean)/.test(t))return true;"
          if old not in s: raise SystemExit('target bad() fragment not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit patch and remove one-time workflow
        shell: bash
        run: |
          git config user.name "Stuff release bot"
          git config user.email "actions@users.noreply.github.com"
          git add mobile/StuffApp.js
          git rm .github/workflows/fix-woolies-accuracy-once.yml
          git commit -m "Improve Woolies product accuracy and fallback matching"
          git push
